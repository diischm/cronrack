name: Image

# The server image for linux/amd64 and linux/arm64 (Raspberry Pi), on GHCR.
#
#   pull request      build both platforms and scan the amd64 image; nothing is pushed,
#                     no registry login, no secrets
#   push to main      build, push ghcr.io/diischm/cronrack:sha-<short sha>, scan it, then
#                     open a deploy PR in the GitOps repo (promote, docs/kubernetes.md)
#   tag vX.Y.Z        the same, also tagged X.Y.Z and X.Y
#
# There is no `latest` tag on purpose: a deployment names the exact version it runs.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Nothing by default; each job asks for exactly what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/diischm/cronrack
  PLATFORMS: linux/amd64,linux/arm64
  # Trivy, installed from its GitHub release and checked against this SHA-256 (taken from
  # the release's official trivy_0.75.0_checksums.txt). v0.75.0 (2026-10-01) is newer
  # than the March 2026 supply-chain incident (GHSA-69fq-xp46-6x23: only binary v0.69.4
  # was affected). Upgrade on purpose: change both values together.
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"

jobs:
  # --- pull requests: build only ----------------------------------------------------------
  build:
    name: Build (no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same build again (from the cache), loaded into Docker so Trivy can read it.
      - name: Load the amd64 image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cronrack-server:pr
          cache-from: type=gha

      - name: Install Trivy
        run: |
          cd /tmp
          FILE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${FILE}"
          echo "${TRIVY_SHA256}  ${FILE}" | sha256sum --check
          tar -xzf "${FILE}" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Scan (fail on HIGH/CRITICAL with a fix available)
        run: >-
          trivy image --no-progress --ignore-unfixed --severity HIGH,CRITICAL
          --exit-code 1 cronrack-server:pr

  # --- main and version tags: build and push ----------------------------------------------
  publish:
    name: Build and push
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write  # push to ghcr.io with the workflow's own GITHUB_TOKEN
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.sha-tag.outputs.tag }}  # sha-<short sha>, as pushed; for promote
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build both platforms and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The sha-<short> tag out of the exact list the build just pushed (never
      # recomputed). Never fails: an empty value makes the promote job stop.
      - name: Pushed sha tag
        id: sha-tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag="$(printf '%s\n' "$TAGS" | sed -n "s|^${IMAGE}:\(sha-[0-9a-f]*\)\$|\1|p" | head -n 1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  # --- scan exactly the pushed digest, per platform ------------------------------------------
  scan:
    name: Scan (${{ matrix.platform }})
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read  # pull the image, also while the package is private
      security-events: write  # upload the SARIF report to code scanning
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
      PLATFORM: ${{ matrix.platform }}
      # Trivy's registry login for ghcr.io, read-only in this job.
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install Trivy
        run: |
          cd /tmp
          FILE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${FILE}"
          echo "${TRIVY_SHA256}  ${FILE}" | sha256sum --check
          tar -xzf "${FILE}" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      # Every finding, for the Security tab; this step itself never fails on findings.
      - name: Report (SARIF)
        run: >-
          trivy image --no-progress --platform "$PLATFORM" --format sarif
          --output trivy.sarif "${IMAGE}@${DIGEST}"

      - name: Upload to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.platform }}

      - name: Gate (fail on HIGH/CRITICAL with a fix available)
        run: >-
          trivy image --no-progress --platform "$PLATFORM" --ignore-unfixed
          --severity HIGH,CRITICAL --exit-code 1 "${IMAGE}@${DIGEST}"

  # --- main only: open a deploy PR in the GitOps repo -------------------------------------------
  # Sets image.tag in the GitOps repo's values file to the tag pushed above and opens a
  # pull request there. Nothing is deployed until that PR is merged; Argo CD then syncs.
  promote:
    name: Promote (deploy PR)
    needs: [publish, scan]  # every scan leg must pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only to check out this repository (for scripts/ci/promote-tag.sh). Everything in
    # the GitOps repo uses DEPLOY_REPO_TOKEN, never GITHUB_TOKEN.
    permissions:
      contents: read
    # DEPLOY_REPO_TOKEN lives in this Environment, which only main may use.
    environment: deploy
    concurrency:
      group: promote-cronrack
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_REPO: diischm/k8s-gitops-lab
      VALUES_FILE: charts/cronrack/values.yaml
      TAG: ${{ needs.publish.outputs.tag }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Validate inputs
        run: |
          [[ $TAG =~ ^sha-[0-9a-f]{7,12}$ ]] || { echo "::error::invalid image tag"; exit 1; }
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid digest"; exit 1; }
          [[ $SOURCE_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid commit SHA"; exit 1; }
          echo "Promoting ${IMAGE}:${TAG}@${DIGEST}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the GitOps repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ref: main
          path: gitops
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          persist-credentials: false

      - name: Set the tag
        id: bump
        run: |
          result="$(scripts/ci/promote-tag.sh "gitops/${VALUES_FILE}" "$TAG")"
          echo "$result"
          if [[ $result == "already set" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Look for an open deploy PR
        id: existing
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          count="$(gh pr list --repo "$DEPLOY_REPO" --head "deploy/cronrack-${TAG}" \
            --state open --json number --jq length)"
          if [[ $count != 0 ]]; then
            echo "A deploy PR for ${TAG} is already open; nothing to do."
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      # The token is only in this step's environment; gh hands it to git as a credential
      # helper. Nothing here prints it.
      - name: Commit and push the deploy branch
        if: steps.bump.outputs.changed == 'true' && steps.existing.outputs.open == 'false'
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          branch="deploy/cronrack-${TAG}"
          gh auth setup-git --hostname github.com
          git switch -c "$branch"
          git add -- "$VALUES_FILE"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898283+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "cronrack: deploy ${TAG}"
          # A branch left over from an earlier, unfinished run (pushed, but no open PR)
          # is replaced; an empty expected value means "must not exist yet".
          remote="$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f1)"
          git push --force-with-lease="refs/heads/${branch}:${remote}" origin "HEAD:refs/heads/${branch}"

      - name: Open the deploy PR
        if: steps.bump.outputs.changed == 'true' && steps.existing.outputs.open == 'false'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          body="$(printf '%s\n' \
            "Source commit: ${REPO_URL}/commit/${SOURCE_SHA}" \
            "Image: ${IMAGE}:${TAG}@${DIGEST}" \
            "Workflow run: ${REPO_URL}/actions/runs/${RUN_ID}")"
          gh pr create --repo "$DEPLOY_REPO" --base main --head "deploy/cronrack-${TAG}" \
            --title "cronrack: deploy ${TAG}" --body "$body"
