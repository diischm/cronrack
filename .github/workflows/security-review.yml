name: PR Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  security-review:
    # Public repo: only review PRs from branches in this repo, not forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    # Pinned to a commit SHA (tag v1 / main as of 2026-10-13); tags can be moved, SHAs can't
    uses: BeyondMachines/pr-bouncer/.github/workflows/security-review.yml@e26494a0e76aa1ca0641f877e1b14eb83948a26c
    with:
      risk_threshold: 6
      semgrep_rules: "p/security-audit,p/owasp-top-ten,p/python,p/django,p/javascript"
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
