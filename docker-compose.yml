# CronRack server: `docker compose up -d` (after creating .env from .env.example).
#
#   caddy      the only service with published ports: 80 (redirects to https) and 443
#   migrate    one-shot: applies database migrations, then exits; app and scheduler
#              start only after it finished successfully
#   app        Django + Channels under uvicorn (pages, JSON, the agents' WebSocket)
#   scheduler  marks hosts that stopped reporting as offline (dead-man's switch)
#
# migrate, app and scheduler run from the same image (its entrypoint picks the role)
# and share the SQLite database volume.

name: cronrack

# Caddy's fixed address on the cronrack network. The app believes X-Forwarded-*
# headers (real client IP, "this was https") only from this address.
x-caddy-ip: &caddy-ip 172.29.80.10

# Hardening shared by migrate, app and scheduler.
x-hardening: &hardening
  # The container's filesystem is read-only; only the volumes and /tmp are writable.
  read_only: true
  tmpfs:
    - /tmp
  # Never gain privileges (blocks setuid binaries such as su).
  security_opt:
    - no-new-privileges:true
  # Drop every Linux capability; a non-root Python web app needs none.
  cap_drop:
    - ALL
  restart: unless-stopped

# Built once from server/Dockerfile and used by migrate, app and scheduler.
x-build: &build
  context: .
  dockerfile: server/Dockerfile

services:
  migrate:
    <<: *hardening
    build: *build
    image: cronrack-server:local
    command: ["migrate"]
    env_file: .env
    volumes:
      - data:/data
    # Needs no network at all: it only talks to the database file.
    network_mode: none
    # A one-shot job: it must NOT be restarted after it exits (the shared hardening
    # block says unless-stopped, which would rerun it forever).
    restart: "no"
    # The image's HEALTHCHECK is for the web server; this container has none.
    healthcheck:
      disable: true

  app:
    <<: *hardening
    build: *build
    image: cronrack-server:local
    command: ["web"]
    env_file: .env
    environment:
      FORWARDED_ALLOW_IPS: *caddy-ip
    volumes:
      # The database (SQLITE_PATH=/data/db.sqlite3, set in the image). Before 0.1.0 this
      # same volume was mounted at /app/server/data; the files in it are unchanged.
      - data:/data
    networks:
      - cronrack
    # No `ports:` on purpose. Port 8000 is reachable only inside the cronrack network.
    # On `docker compose stop`/`down`, uvicorn gets up to 20 s to finish requests in
    # flight (docker-entrypoint.sh); Docker's default of 10 s before SIGKILL is too short.
    stop_grace_period: 25s
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *hardening
    build: *build
    image: cronrack-server:local
    # check_hosts --loop --every 30 --heartbeat-file /tmp/check_hosts.alive
    command: ["scheduler"]
    env_file: .env
    volumes:
      - data:/data
    networks:
      - cronrack
    # Start once the database migrations are applied.
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Healthy while the loop keeps finishing passes (it touches the file every 30 s).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.stat('/tmp/check_hosts.alive').st_mtime > 120)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  caddy:
    # Official image, exact version, pinned by digest (covers amd64 and arm64).
    image: caddy:2.11.7@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Only what Caddy needs: the site name. SECRET_KEY etc. never reach this container.
      CRONRACK_DOMAIN: ${CRONRACK_DOMAIN:?set CRONRACK_DOMAIN in .env}
    volumes:
      # The folder, not the single file: editors save by replacing the file, and a
      # single-file mount would keep showing the container the old copy. caddy/ holds
      # only the Caddyfile. After editing it: docker compose restart caddy
      - ./caddy:/etc/caddy:ro
      # Certificates and Caddy's own CA (keep this volume: agents trust that CA).
      - caddy_data:/data
      - caddy_config:/config
    networks:
      cronrack:
        ipv4_address: *caddy-ip
    depends_on:
      - app
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Caddy runs as root inside its container (its volumes are root-owned); with every
    # other capability dropped, binding ports 80 and 443 is the one thing it may do.
    cap_add:
      - NET_BIND_SERVICE
    # Caddy's admin API listens on 127.0.0.1:2019 inside this container only.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  # A private network for the three services. Not `internal: true`: the app and the
  # scheduler must reach Discord for alerts (and Caddy Let's Encrypt, with a real
  # domain), and Docker blocks all outbound traffic on internal networks.
  cronrack:
    ipam:
      config:
        # Fixed so Caddy can have a fixed address. Docker hands out addresses to the
        # other containers from ip_range only, so they can never take Caddy's.
        # If this collides with another network on your machine, change all three
        # values (subnet, ip_range, x-caddy-ip) to a free range.
        - subnet: 172.29.80.0/24
          ip_range: 172.29.80.128/25

volumes:
  data:
  caddy_data:
  caddy_config:
